spring:
  application:
    name: despesas-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/despesas}
    username: ${DATABASE_USER:despesas}
    password: ${DATABASE_PASSWORD:despesas}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # O schema e responsabilidade do Flyway. O Hibernate so confere se bate.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # O padrão aponta para o Mailpit do docker-compose: em desenvolvimento os
  # e-mails caem numa caixa web em localhost:8025, sem sair para o mundo.
  # Em produção, aponte para o SMTP do Resend/Brevo/Mailgun.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_SENHA:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_TLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cors:
    # Em producao: https://seu-app.vercel.app
    origens: ${CORS_ORIGENS:http://localhost:5173}
  seguranca:
    # Tentativas por IP por minuto nas rotas abertas de autenticação.
    tentativas-por-minuto: ${AUTH_TENTATIVAS_POR_MINUTO:10}

  jwt:
    # Chave de assinatura dos tokens. Gere com: openssl rand -base64 48
    # Sem ela a aplicação não sobe (ver JwtProperties).
    segredo: ${JWT_SECRET:}
    validade-minutos: ${JWT_VALIDADE_MINUTOS:480}

  email:
    remetente: ${EMAIL_REMETENTE:Controle de Despesas <nao-responda@localhost>}
    # Base dos links de confirmação e recuperação: em produção, a URL da Vercel.
    url-do-app: ${URL_DO_APP:http://localhost:5173}

  google:
    # Vazio desliga o botão "Entrar com o Google" — o resto do app funciona igual.
    # Crie em console.cloud.google.com > Credenciais > ID do cliente OAuth (Web).
    client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    root: INFO
    com.rodrigo.despesas: ${LOG_LEVEL:INFO}
