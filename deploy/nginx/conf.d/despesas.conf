# Um bloco `server` por projeto. O Nginx escolhe pelo `server_name`, então
# acrescentar o próximo projeto é copiar um bloco e trocar duas linhas.
#
# Troque `seu-dominio.com.br` pelo seu domínio (ou pelo endereço que o túnel
# te der) antes de subir.

# ---------------------------------------------------------------------------
# Cabeçalhos que todo proxy deste arquivo precisa repassar.
# ---------------------------------------------------------------------------
# Sem X-Forwarded-For e X-Forwarded-Proto o Spring Boot não sabe quem é o
# visitante nem que a conexão original era HTTPS — e os links de e-mail sairiam
# com http://.

# ===========================================================================
# API — Controle de Despesas
# ===========================================================================
server {
    listen 80;
    server_name api.seu-dominio.com.br;

    # A aplicação também envia alguns destes cabeçalhos. Sem descartar a cópia
    # dela, a resposta sai com "X-Frame-Options: DENY, DENY" — que é inválido, e
    # há navegador que ignora o cabeçalho inteiro nesse caso, derrubando em
    # silêncio a proteção contra clickjacking.
    # A borda é a dona destes cabeçalhos: vale para esta e para as próximas
    # aplicações atrás deste Nginx, que podem não enviar nada.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    # Cabeçalhos de segurança (o mesmo conjunto que o Caddy aplicava).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

    # DNS interno do Docker. Resolver em tempo de requisição, e não na
    # inicialização, é o que impede o Nginx de se recusar a subir quando a API
    # ainda está iniciando — sem isto, `host not found in upstream` derruba a
    # porta de entrada inteira e os outros projetos caem junto.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $destino http://api:8080;
        proxy_pass $destino$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # O health check não precisa poluir o log de acesso.
    location /actuator/health {
        access_log off;
        set $destino_saude http://api:8080;
        proxy_pass $destino_saude$request_uri;
        proxy_set_header Host $host;
    }
}

# ===========================================================================
# Front-end — arquivos estáticos do build do Vite
#
# Use este bloco se quiser servir o front do próprio PC em vez da Vercel.
# Rode `npm run build` e aponte o volume para a pasta `frontend/dist`.
# ===========================================================================
server {
    listen 80;
    server_name app.seu-dominio.com.br;

    root  /var/www/despesas;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;

    # Os arquivos com hash no nome nunca mudam de conteúdo: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer caminho desconhecido devolve o index.html, senão recarregar
    # numa rota interna daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

