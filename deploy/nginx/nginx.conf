# Configuração principal do Nginx como porta de entrada dos projetos.
#
# Ele não fala com a internet direto: quem faz isso é o túnel (Cloudflare ou
# Tailscale) ou o redirecionamento de porta do seu roteador. O papel do Nginx
# aqui é decidir, pelo nome do domínio, qual contêiner atende cada requisição.

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    # Não anuncia a versão do Nginx para quem está mapeando alvos.
    server_tokens off;

    # ---------------------------------------------------------------------
    # IP real do visitante
    #
    # Isto NÃO é detalhe cosmético: o limitador de tentativas da API conta por
    # IP. Sem estas linhas, toda requisição chegaria com o IP do Nginx, e as
    # 10 tentativas por minuto seriam somadas do mundo inteiro — a primeira
    # pessoa a errar a senha bloquearia todas as outras.
    # ---------------------------------------------------------------------
    set_real_ip_from  172.16.0.0/12;   # rede interna do Docker
    set_real_ip_from  192.168.0.0/16;  # rede local de casa
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format  principal  '$remote_addr - $host "$request" '
                           '$status $body_bytes_sent ${request_time}s';
    access_log  /var/log/nginx/access.log  principal;
    error_log   /var/log/nginx/error.log   warn;

    # Necessário para WebSocket; inofensivo para quem não usa.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    # Corpo de requisição: a API só recebe JSON pequeno.
    client_max_body_size 1m;

    include /etc/nginx/conf.d/*.conf;
}
