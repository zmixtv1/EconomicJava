services:
  db:
    image: postgres:17-alpine
    # Medido: 55 MiB. A folga é para os buffers crescerem conforme a base
    # aumenta, sem virar vizinho barulhento dos outros projetos.
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-despesas}
      POSTGRES_USER: ${DATABASE_USER:-despesas}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Sem porta publicada no host: a API fala com o banco pela rede interna do
    # Compose, então expor 5432 só ampliaria a superfície de ataque para
    # qualquer processo ou usuário da VPS. Para abrir um psql:
    #   docker compose exec db psql -U despesas -d despesas

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # O Postgres precisa destas para preparar o diretório de dados no primeiro boot.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-despesas} -d ${DATABASE_NAME:-despesas}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Caixa de e-mail falsa para desenvolvimento: recebe tudo que a API envia e
  # mostra em http://localhost:8025. Nada sai para a internet.
  #
  # O `profiles` é o que impede este serviço de subir em produção. Antes só um
  # comentário dizia que ele não subia, e comentário não é obrigado a ser
  # verdade: `docker compose up` levantava o Mailpit em qualquer lugar. Com o
  # SMTP_HOST apontando para cá, os e-mails de confirmação e de recuperação
  # ficariam presos numa caixa local, sem erro nenhum no log — e como o cadastro
  # exige confirmação, ninguém conseguiria criar conta.
  #
  # Em desenvolvimento ele continua subindo sozinho: o .env local define
  # COMPOSE_PROFILES=dev. O .env de produção não tem essa linha.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ['dev']
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build: ./backend
    restart: unless-stopped

    # Medido em uso normal: 511 MiB. O limite existe porque o
    # -XX:MaxRAMPercentage=75 do Dockerfile mede contra a RAM que a JVM
    # enxerga — sem limite, ela enxerga a máquina inteira e se acha no direito
    # de crescer o heap até 6 GB numa VPS de 8 GB, sufocando o Postgres. Com o
    # limite, a JVM detecta o contêiner e dimensiona o heap contra 1,5 GB.
    #
    # Por que 1,5 GB e não 1 GB: 75% de 1 GB dá 768 MiB de heap, e ainda sobram
    # metaspace, pilhas de thread e memória nativa por cima — passaria de 1 GB
    # e o kernel mataria o processo. Aqui o teto fica em ~1,1 GB de heap com
    # folga para o resto.
    mem_limit: 1536m
    depends_on:
      db:
        condition: service_healthy

    # A chave do JWT vem de um arquivo lido em formato bruto: se ela tiver um $,
    # a interpolação do Compose comeria parte do valor e todos os tokens ficariam
    # inválidos — sem nenhum erro visível no boot.
    env_file:
      - path: .env.secrets
        format: raw

    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-despesas}
      DATABASE_USER: ${DATABASE_USER:-despesas}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
      CORS_ORIGENS: ${CORS_ORIGENS:?defina CORS_ORIGENS no .env}

      # Sem padrão: esquecer esta variável em produção passava a valer
      # "mailpit" e o envio morria em silêncio. Agora o Compose se recusa a
      # subir e diz o porquê.
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no .env (em desenvolvimento use "mailpit")}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      # Os padrões aqui são os de produção, e o .env de desenvolvimento é que
      # desliga os dois. Ao contrário, um deploy que esquecesse estas variáveis
      # mandaria a senha do SMTP em texto puro pela internet.
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_TLS: ${SMTP_TLS:-true}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Controle de Despesas <nao-responda@localhost>}
      URL_DO_APP: ${URL_DO_APP:-http://localhost:5173}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    # A aplicação já roda como usuário não-root; isto impede que qualquer
    # binário dentro do contêiner recupere privilégio via setuid.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Quem fala com a internet é o Caddy, que faz o HTTPS e repassa para cá.
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  postgres-data:
